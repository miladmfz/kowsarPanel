<div class="santral-dashboard" dir="rtl">
  <app-dashboard-page-header [filterFa]="filterFa" [loading]="dashboardBusy" [recentLoading]="recentLoading"
    [missedLoading]="missedLoading" (refresh)="refresh()" (loadFull)="loadBothGridsFull()">
  </app-dashboard-page-header>

  <app-dashboard-filter-card [filter]="filter" [filterFa]="filterFa" [loading]="dashboardBusy"
    [callTypeOptions]="callTypeOptions" [dispositionOptions]="dispositionOptions" [summary]="summary"
    [callTypesStats]="callTypes" (load)="loadDashboard()" (reset)="resetFilter()" (setToday)="setToday()"
    (setLastDay)="setLastDay()" (setLast7Days)="setLast7Days()" (setLast30Days)="setLast30Days()">
  </app-dashboard-filter-card>

  @if (errorMessage) {
  <div class="alert alert-danger kws-alert" role="alert" aria-live="assertive">
    <i class="mdi mdi-alert-circle-outline" aria-hidden="true"></i>
    <span>{{ errorMessage }}</span>
  </div>
  }

  <app-dashboard-loading-state [busy]="dashboardBusy" [primaryLoading]="primaryLoading" [missedLoading]="missedLoading"
    [recentLoading]="recentLoading">
  </app-dashboard-loading-state>

  <app-dashboard-stat-cards [summary]="summary" [totalCalls]="totalCalls" [answeredCalls]="answeredCalls"
    [noAnswerCalls]="noAnswerCalls" [busyCalls]="busyCalls" [failedCalls]="failedCalls" [recordedCalls]="recordedCalls"
    [answerRate]="answerRate" [loading]="primaryLoading">
  </app-dashboard-stat-cards>

  <app-dashboard-analytics-panels [primaryLoading]="primaryLoading" [hourlyStats]="hourlyStats" [callTypes]="callTypes"
    [dailyStats]="dailyStats" [topCallers]="topCallers" [topReceivers]="topReceivers" [maxHourlyCount]="maxHourlyCount"
    [maxCallTypeCount]="maxCallTypeCount" [maxDailyCount]="maxDailyCount" [maxTopCallerCount]="maxTopCallerCount"
    [maxTopReceiverCount]="maxTopReceiverCount">
  </app-dashboard-analytics-panels>

  <div class="row g-3 mb-3">
    <app-dashboard-calls-grid-card title="آخرین تماس‌ها" icon="mdi mdi-history" [total]="recentTotal" [logicalTotal]="recentLogicalTotal"
      [searchHint]="recentSearchHint" searchPlaceholder="جستجو در آخرین تماس‌ها..."
      loadingText="در حال دریافت آخرین تماس‌ها..." [loading]="recentLoading" [quickFilter]="recentQuickFilter"
      [limit]="recentLimit" [pageSize]="recentPageSize" [limitOptions]="limitOptions"
      [pageSizeOptions]="pageSizeOptions" [columnDefs]="columnDefs2" [rowData]="recentGridRows()"
      [gridOptions]="gridOptions" [themeClass]="themeClass"
      (quickFilterChange)="recentQuickFilter = $event; applyRecentQuickFilter()"
      (limitChange)="changeRecentLimit($event)" (pageSizeChange)="changeRecentPageSize($event)"
      (reload)="loadRecentCalls()" (gridReadyEvent)="onGridReady($event, 2)">
    </app-dashboard-calls-grid-card>

    <app-dashboard-calls-grid-card title="تماس‌های نیازمند پیگیری" icon="mdi mdi-phone-missed" [total]="missedTotal" [logicalTotal]="missedLogicalTotal"
      [searchHint]="missedSearchHint" searchPlaceholder="جستجو در تماس‌های نیازمند پیگیری..."
      loadingText="در حال دریافت تماس‌های نیازمند پیگیری..." [loading]="missedLoading" [quickFilter]="missedQuickFilter"
      [limit]="missedLimit" [pageSize]="missedPageSize" [limitOptions]="limitOptions"
      [pageSizeOptions]="pageSizeOptions" [columnDefs]="column_name_1" [rowData]="missedGridRows()"
      [gridOptions]="gridOptions" [themeClass]="themeClass"
      (quickFilterChange)="missedQuickFilter = $event; applyMissedQuickFilter()"
      (limitChange)="changeMissedLimit($event)" (pageSizeChange)="changeMissedPageSize($event)"
      (reload)="loadMissedCalls()" (gridReadyEvent)="onGridReady($event, 1)">
    </app-dashboard-calls-grid-card>
  </div>

  <app-dashboard-audio-panel [selectedRecordingUrl]="selectedRecordingUrl"
    [selectedRecordingTitle]="selectedRecordingTitle" [audioModalVisible]="audioModalVisible()" [audioUrl]="audioUrl()"
    [audioTitle]="audioTitle()" (clearRecording)="clearRecording()" (closeAudioModal)="closeAudioModal()">
  </app-dashboard-audio-panel>
</div>
