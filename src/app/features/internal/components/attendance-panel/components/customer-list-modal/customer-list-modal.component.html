<dialog #dialogElement class="kowsar-dialog" dir="rtl" aria-labelledby="customerDialogTitle"
  (cancel)="onDialogCancel($event)" (click)="onDialogBackdropClick($event)">

  <div class="modal-content kowsar-dialog-panel" [ngClass]="darkMode ? 'bg-dark text-white' : 'bg-light text-dark'">

    <div class="modal-header kowsar-modal-header"
      [ngClass]="darkMode ? 'bg-secondary text-white' : 'bg-light text-dark'">

      <h5 id="customerDialogTitle" class="modal-title">
        <i class="fas fa-users me-2"></i>
        لیست مشتریان
      </h5>

      <button type="button" class="btn-close" aria-label="بستن" (click)="requestClose()">
      </button>
    </div>

    <div class="modal-body kowsar-modal-body">
      <form class="mb-3" [formGroup]="searchForm" (ngSubmit)="onSearch()">

        <div class="input-group">
          <input type="text" class="form-control" placeholder="جستجوی مشتری..." formControlName="query" />

          <button class="btn btn-primary" type="submit">
            <i class="fas fa-search"></i>
            جستجو
          </button>
        </div>
      </form>

      <div class="ag-container rounded-3 border shadow-sm kowsar-dialog-grid">
        <ag-grid-angular [enableBrowserTooltips]="true" [tooltipShowDelay]="200" [tooltipHideDelay]="800"
          [class]="themeClass + ' w-100 h-100'" [rowData]="records" [columnDefs]="columnDefs"
          [defaultColDef]="defaultColDef" [enableRtl]="true" [localeText]="localeText" [rowSelection]="{
            mode: 'singleRow',
            enableClickSelection: true
          }" (cellClicked)="onCellClicked($event)" (rowDoubleClicked)="onRowDoubleClicked($event)">
        </ag-grid-angular>
      </div>
    </div>

    <div class="modal-footer kowsar-modal-footer justify-content-between">
      <button type="button" class="btn btn-outline-secondary" (click)="requestClose()">
        بستن
      </button>
    </div>
  </div>
</dialog>
