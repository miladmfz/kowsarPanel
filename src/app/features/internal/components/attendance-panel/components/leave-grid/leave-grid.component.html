@if (loading()) {

<div class="card shadow-sm border-0">

  <div class="card-body text-center py-4">

    <i class="fas fa-spinner fa-spin me-1"></i>

    در حال دریافت مرخصی‌های امروز...

  </div>

</div>

}


@if (!loading() && records().length > 0) {

<div class="card shadow-sm border-0">

  <div class="card-header bg-white d-flex align-items-center justify-content-between flex-wrap gap-2">

    <div class="fw-bold text-primary">

      <i class="fas fa-calendar-check me-1"></i>

      مرخصی‌های تایید شده امروز

    </div>

    <span class="badge bg-primary">

      {{ ToDayDate() }}

    </span>

  </div>


  <div class="ag-container rounded-bottom border-top overflow-hidden" style="height: 200px;">

    <ag-grid-angular [columnDefs]="column_name_1" [rowData]="records()" [gridOptions]="gridOptions"
      [class]="themeClass + ' w-100 h-100'" [pagination]="false" [defaultColDef]="defaultColDef"
      [enableBrowserTooltips]="true" [tooltipShowDelay]="200" [tooltipHideDelay]="800"
      (gridReady)="onGridReady($event, 1)" (firstDataRendered)="gridApi1?.sizeColumnsToFit()">

    </ag-grid-angular>

  </div>

</div>

}


@if (!loading() && records().length === 0) {

<div class="card shadow-sm border-0">

  <div class="card-body py-3 text-center text-muted">

    <i class="fas fa-calendar-check me-1"></i>

    امروز مرخصی تاییدشده‌ای ثبت نشده است.

  </div>

</div>

}
