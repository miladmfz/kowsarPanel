<dialog #dialogElement class="kowsar-dialog" dir="rtl" aria-labelledby="historyDialogTitle"
  (cancel)="onDialogCancel($event)" (click)="onDialogBackdropClick($event)">

  <div class="modal-content kowsar-dialog-panel" [ngClass]="darkMode ? 'bg-dark text-white' : 'bg-light text-dark'">

    <div class="modal-header kowsar-modal-header"
      [ngClass]="darkMode ? 'bg-secondary text-white' : 'bg-light text-dark'">

      <h5 id="historyDialogTitle" class="modal-title">
        <i class="fas fa-clock me-2"></i>
        {{ title }}
      </h5>

      <button type="button" class="btn-close" aria-label="بستن" (click)="requestClose()">
      </button>
    </div>

    <div class="modal-body kowsar-modal-body p-0">
      @if (recordsValue.length === 0) {
      <div class="text-center py-5 text-muted">
        <i class="fas fa-spinner fa-spin" style="font-size: 18px; color: #0d47a1;">
        </i>

        <div>در حال بارگذاری اطلاعات یا داده‌ای موجود نیست...</div>
      </div>
      } @else {
      <div class="ag-container rounded-3 border shadow-sm kowsar-dialog-grid">
        <ag-grid-angular [enableBrowserTooltips]="true" [tooltipShowDelay]="200" [tooltipHideDelay]="800"
          [rowData]="recordsValue" [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [localeText]="localeText"
          [enableRtl]="true" [pagination]="true" [class]="themeClass + ' w-100 h-100'">
        </ag-grid-angular>
      </div>
      }
    </div>

    <div class="modal-footer kowsar-modal-footer d-flex justify-content-between">
      <small [ngClass]="darkMode ? 'text-light' : 'text-muted'">
        تعداد رکوردها:
        <strong>{{ totalRecords() }}</strong>
      </small>

      <button type="button" class="btn btn-secondary px-4" (click)="requestClose()">
        بستن
      </button>
    </div>
  </div>
</dialog>
