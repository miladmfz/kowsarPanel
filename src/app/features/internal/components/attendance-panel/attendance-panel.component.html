<!-- =============================================================== -->
<!-- 📋 داشبورد وضعیت حضور کارشناسان -->
<!-- توضیحات کلی:
     این قالب شامل بخش‌های مختلف مرتبط با مدیریت حضور کارشناسان است:
     1️⃣ کارت اصلی وضعیت حضور شامل گرید مرخصی و حضور
     2️⃣ مودال تاریخچه حضور
     3️⃣ مودال مدیریت تیکت‌ها
     4️⃣ مودال انتخاب مشتری
     تمامی بخش‌ها از کامپوننت‌های مستقل استفاده می‌کنند و وضعیت تم (تیره/روشن)
     و سیگنال‌های نمایش مودال‌ها به‌صورت داینامیک کنترل می‌شود.
-->
<!-- =============================================================== -->

<!-- =============================================================== -->
<!--    کارت وضعیت حضور -->
<!-- =============================================================== -->
<div class="card p-3">

  <!-- =============================================================== -->
  <!--    Header -->
  <!-- =============================================================== -->
  <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2" [ngClass]="{
      'bg-dark text-white border-secondary': isDarkMode,
      'bg-light text-dark border-light': !isDarkMode
    }">
    <h5 class="card-title mb-0">
      <i class="fas fa-user-clock"></i>
      وضعیت حضور
    </h5>

    <!-- 🔁 کنترل بروزرسانی دستی / خودکار -->
    <div class="attendance-refresh-controls">
      <button type="button" class="btn attendance-refresh-btn"
        [ngClass]="isDarkMode ? 'btn-outline-light' : 'btn-outline-primary'" [disabled]="isRefreshing()"
        (click)="manualRefresh()" title="بروزرسانی دستی">
        <i class="fas fa-sync-alt" [class.fa-spin]="isRefreshing()"></i>
        <span>بروزرسانی</span>
      </button>

      <button type="button" class="btn attendance-refresh-btn attendance-auto-btn" [class.active]="autoRefresh()"
        (click)="toggleAutoRefresh()"
        [title]="autoRefresh() ? 'بروزرسانی خودکار فعال است' : 'بروزرسانی خودکار غیرفعال است'">
        <i [class]="autoRefresh() ? 'fas fa-stopwatch' : 'fas fa-pause-circle'"></i>
        <span>{{ autoRefresh() ? 'خودکار فعال' : 'حالت دستی' }}</span>
      </button>

      <label class="attendance-refresh-interval" title="فاصله بروزرسانی خودکار">
        <i class="fas fa-clock"></i>
        <select [value]="refreshSeconds()" (change)="changeRefreshSeconds($any($event.target).value)"
          [disabled]="!autoRefresh()">
          <option value="5">هر ۵ ثانیه</option>
          <option value="10">هر ۱۰ ثانیه</option>
          <option value="15">هر ۱۵ ثانیه</option>
          <option value="30">هر ۳۰ ثانیه</option>
          <option value="60">هر ۱ دقیقه</option>
          <option value="120">هر ۲ دقیقه</option>
        </select>
      </label>

      <div class="attendance-last-update" title="آخرین زمان بروزرسانی موفق">
        آخرین بروزرسانی
        <strong>{{ lastUpdateText() || '---' }}</strong>
      </div>
    </div>
  </div>

  <!-- =============================================================== -->
  <!--   گرید مرخصی -->
  <!-- =============================================================== -->

  <div class="m-1"></div>

  <!-- =============================================================== -->
  <!-- 📋 گرید حضور کارشناسان -->
  <!-- =============================================================== -->
  <app-attendance-grid #attendanceGrid [darkMode]="isDarkMode" (openHistory)="openHistory($event)"
    (openLetter)="openLetter($event)" (openCallReport)="openCallReport($event)"
    (refreshFinished)="onAttendanceRefreshFinished($event)"></app-attendance-grid>
</div>

<!-- =============================================================== -->
<!-- ☎️ مودال گزارش تماس کارشناس -->
<!-- =============================================================== -->
@if (Call_report_Show_Modal()) {
<app-attendance-call-report-modal [visible]="Call_report_Show_Modal()" [extension]="Call_report_extension()"
  [personName]="Call_report_person_name()" [darkMode]="isDarkMode" (close)="closeCallReportModal()">
</app-attendance-call-report-modal>
}

<!-- =============================================================== -->
<!-- 🕓 مودال تاریخچه حضور -->
<!-- =============================================================== -->
@if (Attendance_history_Show_Modal()) {
<app-attendance-history-modal [visible]="Attendance_history_Show_Modal()" [records]="Attendance_history_records()"
  [darkMode]="isDarkMode" (close)="closeHistoryModal()"></app-attendance-history-modal>
}

<!-- =============================================================== -->
<!-- 📬 مودال تیکت‌ها -->
<!-- =============================================================== -->
@if (showLetterModal()) {
<app-letter-modal [visible]="showLetterModal()" [records]="Letter_records()" [darkMode]="isDarkMode"
  [person]="selectedPerson()" (close)="closeLetterModal()" (submitLetter)="onSubmitLetter($event)"
  (requestSelectCustomer)="openCustomerModal()"></app-letter-modal>
}

<!-- =============================================================== -->
<!--   مودال لیست مشتریان -->
<!-- =============================================================== -->
@if (Customer_Show_Modal()) {
<app-customer-list-modal [visible]="Customer_Show_Modal()" [records]="Customer_records()" [darkMode]="isDarkMode"
  (close)="closeCustomerModal()" (selectCustomer)="onCustomerSelected($event)"
  (searchRequested)="openCustomerModal($event)"></app-customer-list-modal>
}
