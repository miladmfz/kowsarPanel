<div class="card">
  <div class="card-body">
    <h3>{{title()}}</h3>

    <form [formGroup]="EditForm_PersonInfo" id="submitForm">
      <div class="row">

        <div class="row form-group m-1 col-md-12">


          @if (isVisible('PhCompanyName')) {

          <div class="form-group col-md-2"> </div>
          <div class="form-group col-md-4">
            <label for="PhCompanyName">موسسه</label>
            <input type="text" id="PhCompanyName" class="form-control" formControlName="PhCompanyName" />
          </div>
          }



        </div>


        <div class="row form-group m-1 col-md-12">


          <div class="form-group col-md-4">
            <label for="CustomerRef" class="col-form-label"> مشتری</label>
            <input type="text" class="form-control" id="CustomerRef" formControlName="CustomerRef" maxlength="100"
              autocomplete="off" readonly />

          </div>

          <div class="form-group col-md-4">
            <label for="CustomerName" class="col-form-label">نام مشتری</label>
            <input type="text" id="CustomerName" class="form-control" formControlName="CustomerName" readonly />
          </div>

          <div class="form-group col-md-4">
            <label for="PhCompanyName" class="col-form-label">بخش</label>
            <input type="text" id="PhCompanyName" class="form-control" formControlName="PhCompanyName" />
          </div>
        </div>

        <div class="row form-group m-1 col-md-12">

          <div class="form-group col-md-4">
            <label for="PhFirstName" class="col-form-label">نام</label>
            <input type="text" id="PhFirstName" class="form-control" formControlName="PhFirstName" />
          </div>

          <div class="form-group col-md-4">
            <label for="PhLastName" class="col-form-label">نام خانوادگی</label>
            <input type="text" id="PhLastName" class="form-control" formControlName="PhLastName" />
          </div>
          <div class="form-group col-md-4">
            <label for="PhMobile1" class="col-form-label">موبایل ۱</label>
            <input type="text" id="PhMobile1" class="form-control" formControlName="PhMobile1" />
          </div>


        </div>





      </div>
    </form>
  </div>
</div>

<!-- دکمه‌ها -->
<div class="card mt-3">
  <div class="card-body">
    <button class="btn btn-success m-2" (click)="submit_PersonInfo()">
      <i class="fas fa-check-double"></i> ثبت
    </button>
    <button class="btn btn-light m-2" (click)="onCancel()">انصراف</button>
  </div>
</div>

<ng-template #formError let-control="control" let-message="message" let-validation="validation">
  @if (control.hasError(validation) && (control.dirty || control.touched)) {
  <div class="invalid-feedback d-block">{{ message }}</div>
  }
</ng-template>
