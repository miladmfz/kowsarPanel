<div class="row" dir="rtl">
  <div class="col-12">

    <form [formGroup]="EditForm_LetterInsert" (ngSubmit)="submit('')" id="submitForm">

      <div class="card border-0 shadow-sm rounded-4 bg-white bg-opacity-100 overflow-hidden">

        <!-- Header -->
        <div class="card-header bg-white border-bottom py-3 px-4">
          <div class="d-flex align-items-center justify-content-between gap-3 flex-wrap">

            <div class="d-flex align-items-center gap-2">


              <h4 class="mb-0 fw-bold">
                ایجاد تیکت جدید
              </h4>
            </div>



          </div>
        </div>

        <!-- Body -->
        <div class="card-body p-4">

          <div class="row g-3">

            <!-- تاریخ -->
            <div class="col-12 col-md-6 col-xl-2">
              <label class="form-label fw-semibold">
                تاریخ
              </label>

              <input id="LetterDate" type="text" class="form-control bg-light" formControlName="LetterDate" readonly
                autocomplete="off" [readOnly]="true" />
            </div>

            <!-- عنوان تیکت -->
            <div class="col-12 col-md-6 col-xl-3">
              <label class="form-label fw-semibold">
                عنوان تیکت
                <span class="text-danger">*</span>
                <span class="text-info small">(انتخابی)</span>
              </label>

              <select id="title" formControlName="title" class="form-select"
                [class.is-invalid]="EditForm_LetterInsert.controls['title'].invalid && EditForm_LetterInsert.controls['title'].touched"
                [class.is-valid]="EditForm_LetterInsert.controls['title'].valid && EditForm_LetterInsert.controls['title'].touched">

                <option value="">لطفاً انتخاب کنید</option>

                @for (item of Title_Lookup; track item) {
                <option [value]="item.id">{{ item.name }}</option>
                }

              </select>

              <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
                  validation: 'required',
                  message: 'اجباری است',
                  control: EditForm_LetterInsert.controls['title']
                }">
              </ng-container>
            </div>

            <!-- انتخاب مشتری -->
            @if (IsEmploy()) {
            <div class="col-12 col-md-6 col-xl-2">
              <label class="form-label fw-semibold">
                کد مشتری
                <span class="text-danger">*</span>
                <span class="text-info small">(انتخابی)</span>
              </label>

              <div class="input-group">
                <input id="OwnerCentral" type="text" class="form-control bg-light" placeholder="نمایش مشتریان"
                  formControlName="OwnerCentral" readonly autocomplete="off" (click)="GetCentral()"
                  [class.is-invalid]="EditForm_LetterInsert.controls['OwnerCentral'].invalid && EditForm_LetterInsert.controls['OwnerCentral'].touched"
                  [class.is-valid]="EditForm_LetterInsert.controls['OwnerCentral'].valid && EditForm_LetterInsert.controls['OwnerCentral'].touched" />

                <button class="btn btn-outline-primary" type="button" (click)="GetCentral()">
                  <i class="mdi mdi-account-search-outline"></i>
                </button>
              </div>

              <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
                    validation: 'required',
                    message: 'اجباری است',
                    control: EditForm_LetterInsert.controls['OwnerCentral']
                  }">
              </ng-container>
            </div>
            }

            <!-- نام مشتری -->
            <div class="col-12 col-md-6 col-xl-3">
              <label class="form-label fw-semibold">
                نام مشتری
              </label>

              <input id="OwnerName" type="text" formControlName="OwnerName" class="form-control bg-light" readonly />
            </div>

            <!-- محرمانگی -->
            @if (!IsEmploy()) {
            <div class="col-12 col-md-6 col-xl-2">
              <label class="form-label fw-semibold">
                محرمانگی
              </label>

              <select id="IsPrivate" formControlName="IsPrivate" class="form-select">

                <option value="">لطفاً انتخاب کنید</option>

                @for (item of IsPrivate_Lookup; track item) {
                <option [value]="item.id">{{ item.name }}</option>
                }

              </select>
            </div>
            }

            <!-- اولویت -->
            @if (IsEmploy()) {
            <div class="col-12 col-md-6 col-xl-2">
              <label class="form-label fw-semibold">
                اولویت
              </label>

              <select id="LetterPriority" formControlName="LetterPriority" class="form-select"
                [class.is-invalid]="EditForm_LetterInsert.controls['LetterPriority'].invalid && EditForm_LetterInsert.controls['LetterPriority'].touched"
                [class.is-valid]="EditForm_LetterInsert.controls['LetterPriority'].valid && EditForm_LetterInsert.controls['LetterPriority'].touched">

                <option value="">لطفاً انتخاب کنید</option>

                @for (item of LetterPriority_lookup; track item) {
                <option [value]="item.aType">{{ item.aType }}</option>
                }

              </select>

              <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
                    validation: 'required',
                    message: 'اجباری است',
                    control: EditForm_LetterInsert.controls['LetterPriority']
                  }">
              </ng-container>
            </div>

            <!-- نوع نامه -->
            <div class="col-12 col-md-6 col-xl-2">
              <label class="form-label fw-semibold">
                نوع نامه
              </label>

              <select id="InOutFlag" formControlName="InOutFlag" class="form-select"
                [class.is-invalid]="EditForm_LetterInsert.controls['InOutFlag'].invalid && EditForm_LetterInsert.controls['InOutFlag'].touched"
                [class.is-valid]="EditForm_LetterInsert.controls['InOutFlag'].valid && EditForm_LetterInsert.controls['InOutFlag'].touched">

                <option value="">لطفاً انتخاب کنید</option>

                @for (item of InOut_Lookup; track item) {
                <option [value]="item.id">{{ item.name }}</option>
                }

              </select>

              <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
                    validation: 'required',
                    message: 'اجباری است',
                    control: EditForm_LetterInsert.controls['InOutFlag']
                  }">
              </ng-container>
            </div>
            }

            <!-- شرح تیکت -->
            <div class="col-12">
              <label class="form-label fw-semibold">
                شرح تیکت
                <span class="text-danger">*</span>
              </label>

              <textarea id="Description" formControlName="Description" class="form-control" rows="5" autocomplete="off"
                placeholder="شرح کامل درخواست خود را وارد کنید..."
                [class.is-invalid]="EditForm_LetterInsert.controls['Description'].invalid && EditForm_LetterInsert.controls['Description'].touched"
                [class.is-valid]="EditForm_LetterInsert.controls['Description'].valid && EditForm_LetterInsert.controls['Description'].touched">
              </textarea>

              <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
                  validation: 'required',
                  message: 'اجباری است',
                  control: EditForm_LetterInsert.controls['Description']
                }">
              </ng-container>
            </div>

          </div>

        </div>

        <!-- Footer Buttons -->
        <div class="card-footer bg-white border-top py-3 px-4">
          <div class="d-flex align-items-center justify-content-between gap-2 flex-wrap">


            <div class="d-flex align-items-center gap-2 flex-wrap">

              <button type="submit" class="btn btn-success rounded-pill px-4">
                <i class="fas fa-check-double me-1"></i>
                ارسال تیکت
              </button>

              @if (LoginType() === 'KOWSAR') {
              <button type="button" class="btn btn-primary rounded-pill px-4" (click)="submit('detail')">
                <i class="fas fa-share-square me-1"></i>
                ثبت و ارجاع تیکت
              </button>
              }

            </div>

          </div>
        </div>

      </div>

    </form>

  </div>
</div>

<!-- Modal: لیست مشتریان -->
<div class="modal fade" #centrallist tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg kowsar-modal-dialog">
    <div class="modal-content border-0 shadow rounded-4 overflow-hidden bg-white">

      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title mb-0">
          لیست مشتریان
        </h5>

        <button type="button" class="btn-close btn-close-white" (click)="centrallist_dialog_close()">
        </button>
      </div>

      <div class="modal-body p-3">

        <div class="mb-3">
          <input type="text" class="form-control" placeholder="جستجو..." [(ngModel)]="Searchtarget_central"
            (ngModelChange)="onInputChange_Customer()" [ngModelOptions]="{ standalone: true }" />
        </div>

        @if (loading()) {
        <div class="text-center my-3">
          <div class="spinner-border" role="status">
            <span class="visually-hidden">در حال بارگذاری...</span>
          </div>
        </div>
        }

        <div class="ag-container border rounded-3 overflow-hidden" style="height: 600px;">
          <ag-grid-angular [enableBrowserTooltips]="true" [tooltipShowDelay]="200" [tooltipHideDelay]="800"
            [columnDefs]="column_name_1" [rowData]="records_support_central()" (gridReady)="onGridReady($event, 1)"
            [gridOptions]="gridOptions" [class]="themeClass + ' w-100 h-100'"
            [rowSelection]="{ mode: 'singleRow', enableClickSelection: true }"
            (firstDataRendered)="gridApi1?.sizeColumnsToFit()" (selectionChanged)="onSelectionChanged($event)">
          </ag-grid-angular>
        </div>

      </div>

      <div class="modal-footer bg-light border-top">
        <button type="button" class="btn btn-light border" (click)="centrallist_dialog_close()">
          بستن
        </button>

        <button type="button" class="btn btn-primary px-4" (click)="Set_Customer()">
          انتخاب
        </button>
      </div>

    </div>
  </div>
</div>

<!-- قالب خطا -->
<ng-template #formError let-control="control" let-message="message" let-validation="validation">
  @if (control.hasError(validation) && (control.dirty || control.touched)) {
  <div class="fv-plugins-message-container invalid-feedback d-block">
    <span role="alert">{{ message }}</span>
  </div>
  }
</ng-template>
