<div class="card shadow-sm">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3"><div><h4 class="card-title mb-1">{{ title() }}</h4><div class="text-muted small">قوانین هر نوع درخواست از دیتابیس خوانده می‌شود</div></div><button type="button" class="btn btn-light" (click)="cancel()">بازگشت</button></div>
    @if (loading()) { <div class="alert alert-info py-2">در حال پردازش...</div> }

    <form [formGroup]="EditForm" (ngSubmit)="submit()">
      <div class="row g-3">
        <div class="col-md-2"><label class="form-label">کد</label><input formControlName="AbsenceTypeCode" class="form-control text-center" readonly /></div>
        <div class="col-md-3"><label class="form-label">کلید</label><input formControlName="TypeKey" class="form-control text-uppercase" [class.is-invalid]="isInvalid('TypeKey')" /></div>
        <div class="col-md-4"><label class="form-label">عنوان</label><input formControlName="TypeTitle" class="form-control" [class.is-invalid]="isInvalid('TypeTitle')" /></div>
        <div class="col-md-3"><label class="form-label">ترتیب نمایش</label><input formControlName="DisplayOrder" type="number" class="form-control text-center" /></div>

        <div class="col-md-4"><label class="form-label">روش محاسبه</label><select formControlName="CalculationMode" class="form-control" [style.pointer-events]="isEmergencyType() ? 'none' : 'auto'" [class.bg-light]="isEmergencyType()">@for (x of CalculationModes; track x.id) { <option [value]="x.id">{{ x.title }}</option> }</select></div>
        <div class="col-md-4"><label class="form-label">روش کسر سهمیه</label><select formControlName="BalanceMode" class="form-control" [style.pointer-events]="isEmergencyType() ? 'none' : 'auto'" [class.bg-light]="isEmergencyType()">@for (x of BalanceModes; track x.id) { <option [value]="x.id">{{ x.title }}</option> }</select></div>
        <div class="col-md-2"><label class="form-label">فاصله روز کاری</label><input formControlName="MinimumAdvanceWorkDay" type="number" class="form-control text-center" [readonly]="isEmergencyType()" [class.bg-light]="isEmergencyType()" /></div>
        <div class="col-md-2"><label class="form-label">فعال</label><select formControlName="IsActive" class="form-control"><option value="1">بله</option><option value="0">خیر</option></select></div>

        <div class="col-md-2"><label class="form-label">جمعه</label><select formControlName="AllowFriday" class="form-control"><option value="0">غیرمجاز</option><option value="1">مجاز</option></select></div>
        <div class="col-md-2"><label class="form-label">تعطیل رسمی</label><select formControlName="AllowHoliday" class="form-control"><option value="0">غیرمجاز</option><option value="1">مجاز</option></select></div>
        <div class="col-md-2"><label class="form-label">پیوست</label><select formControlName="RequireAttachment" class="form-control"><option value="0">اختیاری</option><option value="1">لازم</option></select></div>
        <div class="col-md-2"><label class="form-label">پیوست بعد از روز</label><input formControlName="AttachmentRequiredAfterDay" type="number" step="0.5" class="form-control text-center" /></div>
        <div class="col-md-2"><label class="form-label">توضیحات</label><select formControlName="RequireDescription" class="form-control"><option value="1">اجباری</option><option value="0">اختیاری</option></select></div>
        <div class="col-md-2"><label class="form-label">کسر سهمیه</label><select formControlName="DeductFromBalance" class="form-control"><option value="1">بله</option><option value="0">خیر</option></select></div>

        <div class="col-md-3"><label class="form-label">تمام وقت</label><select formControlName="AllowFullTime" class="form-control"><option value="1">مجاز</option><option value="0">غیرمجاز</option></select></div>
        <div class="col-md-3"><label class="form-label">پاره وقت</label><select formControlName="AllowPartTime" class="form-control"><option value="1">مجاز</option><option value="0">غیرمجاز</option></select></div>
        <div class="col-md-3"><label class="form-label">شیفتی</label><select formControlName="AllowShift" class="form-control"><option value="1">مجاز</option><option value="0">غیرمجاز</option></select></div>
        <div class="col-md-3"><label class="form-label">اختصاصی</label><select formControlName="AllowCustom" class="form-control"><option value="1">مجاز</option><option value="0">غیرمجاز</option></select></div>

        <div class="col-12"><label class="form-label">متن راهنما</label><textarea formControlName="HelpText" rows="3" class="form-control"></textarea></div>
        <div class="col-12 d-flex justify-content-end gap-2"><button type="button" class="btn btn-secondary px-4" (click)="cancel()">انصراف</button><button type="submit" class="btn btn-success px-4">ذخیره</button></div>
      </div>
    </form>
  </div>
</div>
