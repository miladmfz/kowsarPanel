<router-outlet></router-outlet>
<app-ag-grid-settings-dialog></app-ag-grid-settings-dialog>

@if (loadingService.loading()) {
<div class="kws-app-loading-backdrop" dir="rtl" role="status" aria-live="polite" aria-busy="true">
    <div class="kws-app-loading-card">
        <div class="kws-app-loading-accent" aria-hidden="true"></div>
        <div class="kws-app-loading-content">
            <div class="kws-app-loading-icon" aria-hidden="true">
                <i class="fas fa-spinner fa-spin"></i>
            </div>
            <div class="kws-app-loading-title">لطفاً منتظر بمانید...</div>
            <div class="kws-app-loading-subtitle">در حال پردازش اطلاعات</div>
        </div>
    </div>
</div>
}
