<div class="row g-3 align-items-stretch dashboard-section dashboard-top-row">

  <div class="col-lg-8 col-12 dashboard-attendance-column">
    <app-attendance-panel></app-attendance-panel>
  </div>

  @if (LoginType() === 'KOWSAR') {
  <div class="col-lg-4 col-12 dashboard-call-summary-column">
    <app-attendance-call-report class="h-100" [extension]="ownExtension()" [personName]="ownPersonName()"
      [darkMode]="false" [compact]="true" mode="summary">
    </app-attendance-call-report>
  </div>
  }

</div>

<div class="row g-3 align-items-stretch dashboard-section dashboard-second-row">

  @if (LoginType() === 'KOWSAR') {
  <div class="col-lg-8 col-12 dashboard-followup-column">
    <app-attendance-call-report class="h-100" [extension]="ownExtension()" [personName]="ownPersonName()"
      [darkMode]="false" mode="followup">
    </app-attendance-call-report>
  </div>
  }

  <div class="col-lg-4 col-12 dashboard-calendar-column">
    <app-kowsar-calendar></app-kowsar-calendar>
  </div>

</div>

<div class="dashboard-section">
  <app-leave-grid></app-leave-grid>
</div>

@if (permissionService.canManageRole) {
<div class="dashboard-section">
  <app-autletter-chart [CentralRef]="'0'"></app-autletter-chart>
</div>
}

<div class="dashboard-section">
  <app-kowsar-report></app-kowsar-report>
</div>
